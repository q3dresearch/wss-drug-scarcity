<text x="24.0" y="558.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">Q24. Germany bottom-right: refused constantly, almost never alerted. China top-left: the inverse. Mexico is alone in the top-right. Refusals</text>
<text x="24.0" y="572.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">are FIRM-DAYS — a firm refused five times in a day counts once. Countries with fewer than 40 registered sites are excluded; one event there</text>
<text x="24.0" y="586.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">moves a rate by whole points.</text>
