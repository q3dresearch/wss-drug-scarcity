<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-label="Import alerts against import refusals, by country">
<title>Import alerts against import refusals, by country</title>
<desc>Scatter of alerts per 100 registered sites against refusal firm-days per site; bubble area is registered sites.</desc>
<rect width="880" height="620" fill="#fcfcfb"/>
<text x="24.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Alerted and refused are different failures</text>
<text x="24.0" y="62.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Each bubble is a country; area is the number of sites on the current drug establishment register. An import</text>
<text x="24.0" y="79.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">alert is standing detention WITHOUT physical examination, so an alerted firm stops shipping and its refusals</text>
<text x="24.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">collapse — which is why the two axes are not the same measurement twice.</text>
