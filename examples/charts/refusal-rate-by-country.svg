<svg xmlns="http://www.w3.org/2000/svg" width="880" height="695.0" viewBox="0 0 880 695.0" role="img" aria-label="Refusal firm-days per registered site">
<title>Refusal firm-days per registered site</title>
<desc>FDA import-refusal firm-days 2001-2026 per site on the current drug establishment register, by country.</desc>
<rect width="880" height="695.0" fill="#fcfcfb"/>
<text x="24.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Being alerted and being refused are not the same thing</text>
<text x="24.0" y="62.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">Import-refusal firm-days per site on the current drug establishment register, 2001-2026 — 7,984 firm-days against</text>
<text x="24.0" y="79.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">9,882 sites. Mexico tops this AND the import-alert rate. Germany and China are opposites: Germany 3.4 refusals per</text>
<text x="24.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">site on 0.8 alerts per 100, China 0.5 refusals on 14.1 alerts. An alert is standing detention without physical</text>
<text x="24.0" y="113.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">examination, so an alerted firm stops shipping and its refusals collapse. The alert is the policy; the refusal is the</text>
<text x="24.0" y="130.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" style="">exercise.</text>
