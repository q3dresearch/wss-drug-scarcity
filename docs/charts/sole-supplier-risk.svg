<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="570.0" viewBox="0 0 980.0 570.0" role="img" aria-label="Plants that alone supply several shorted drugs">
<title>Plants that alone supply several shorted drugs</title>
<desc>Where one interruption takes more than one drug with it.</desc>
<rect width="980.0" height="570.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q7b — plants that are the only listed maker of several shorted drugs</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Of 1,594 shorted drug packages, 218 (14%) resolve cleanly to a single establishment — 57 distinct molecules. Bar</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">length is how many of those a plant carries alone; the text at right is that plant's enforcement record. Decision this</text>
<text x="24.0" y="88.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">supports: where a second source is worth qualifying, because a single interruption here takes several drugs at once. A</text>
<text x="24.0" y="105.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">clean record is not reassurance — Eli Lilly carries eight with nothing recorded against it.</text>
<text x="24.0" y="128.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">Read “only listed maker” strictly: it means every manufacturer named on the shortage record matched one establishment. A drug</text>
<text x="24.0" y="145.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">whose second maker has no enforcement record at all is EXCLUDED rather than counted as single-source — 65 of 283 failed that</text>
<text x="24.0" y="162.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal" style="">test, and counting them would have invented sole suppliers that do not exist.</text>
<rect x="24.0" y="180.0" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="39.0" y="189.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">an enforcement record exists</text>
<rect x="231.4" y="180.0" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="246.4" y="189.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">nothing recorded</text>
