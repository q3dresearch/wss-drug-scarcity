<text x="24.0" y="619.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">Q22. FIRM-DAYS, not refusals: `import_refusal` is emitted as (firm, 1, date), so a firm refused five times in a day collapses to one row and</text>
<text x="24.0" y="633.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">89,086 records reduce to 55,875. Note also Q23 — only 14% of all firm-days hit a registered site at all, so this measures enforcement against</text>
<text x="24.0" y="647.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">the REGISTERED base, not enforcement overall.</text>
