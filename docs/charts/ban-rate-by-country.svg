<line x1="132" y1="149.0" x2="132" y2="565.0" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="24.0" y="583.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">Q12, previously blocked. The denominator is a SNAPSHOT of the register today; the numerator is CUMULATIVE across every year FDA has listed a</text>
<text x="24.0" y="597.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">firm. That understates the rate where the registered base has grown and overstates it where it has shrunk — a flaw worth naming, not</text>
<text x="24.0" y="611.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal" style="">smoothing. Countries with fewer than 40 registered sites are excluded, because one ban there moves the rate by whole points.</text>
