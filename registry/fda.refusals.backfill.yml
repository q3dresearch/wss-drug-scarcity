gates:
  expect_status: 200
  # A year slice is 559 rows at its smallest, so the floor is set against that
  # rather than against the 5,000-row maximum.
  min_bytes: 90000
  content_type_any: [json]
  must_contain: ["FEINumber", "RefusalDate", "totalrecordcount"]
  must_not_contain: ["Not Authorized"]
  max_shrink_pct: 50
