<title>After an Official Action, what follows and how fast</title>
<desc>Named establishments where FDA escalated, and the lag.</desc>
<rect width="980.0" height="611.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q6b — after an Official Action, what follows and how fast</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Of 2197 establishments classified Official Action Indicated, 1469 (67%) drew a compliance action or a recall</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">afterwards. Bar length is months from the OAI to that first consequence; the count at right is how many followed in</text>
<text x="24.0" y="88.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">total. Decision this supports: an OAI is an early warning with months of lead time, not a lagging record — these named</text>
<text x="24.0" y="105.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">plants are where supply risk concentrated. Ordering is within the captured window only, and many names here are</text>
