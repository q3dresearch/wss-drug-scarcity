<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="573.0" viewBox="0 0 980.0 573.0" role="img" aria-label="Drug inspections a year, and the OAI rate">
<title>Drug inspections a year, and the OAI rate</title>
<desc>Volume has not recovered; the share finding serious problems rose.</desc>
<rect width="980.0" height="573.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q6c — fewer inspections, a higher share finding serious problems</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Drug-facility inspections a year (bars) against the share classified Official Action Indicated (line). Volume fell 64%</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">in 2020 and is still 14% below the 2009-2019 average of 2,541 six years later, while the rate went the other way —</text>
<text x="24.0" y="88.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">6.7% before 2020, 10.3% after. Two readings this data cannot separate: FDA triaging scarce inspectors toward plants</text>
<text x="24.0" y="105.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">already suspected, which raises the rate by construction, or a manufacturing base that deteriorated during the gap.</text>
<text x="24.0" y="122.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Both axes start at zero, so the crossing is not an artefact of where they were put.</text>
