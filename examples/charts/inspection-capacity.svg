<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="689.0" viewBox="0 0 980.0 689.0" role="img" aria-label="Drug inspections a year, and the OAI rate">
<title>Drug inspections a year, and the OAI rate</title>
<desc>Volume has not recovered; the share finding serious problems rose.</desc>
<rect width="980.0" height="689.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q6c — fewer inspections, a higher share finding serious problems</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Drug-facility inspections a year, and the share classified Official Action Indicated. Volume fell 64% in 2020 and is</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">still 14% below the 2009-2019 average of 2,541 six years later, while the OAI rate went the other way — 6.7% before</text>
<text x="24.0" y="88.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">2020, 10.3% after. Two readings this data cannot separate: FDA triaging scarce inspectors toward plants already</text>
<text x="24.0" y="105.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">suspected, which raises the rate by construction, or a manufacturing base that deteriorated during the gap. Separate</text>
<text x="24.0" y="122.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">panels, not two scales on one plot — the crossover point of a dual axis is an artefact of where you put the axes.</text>
<text x="24.0" y="153.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Inspections a year</text>
