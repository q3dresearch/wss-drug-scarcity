<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="525.0" viewBox="0 0 980.0 525.0" role="img" aria-label="Drug inspections a year against the OAI rate">
<title>Drug inspections a year against the OAI rate</title>
<desc>Volume has not recovered; the share finding serious problems rose.</desc>
<rect width="980.0" height="525.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q6c — fewer inspections, a higher share finding serious problems</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Drug-facility inspections a year (bars, left) against the share classified Official Action Indicated (line, right).</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Volume fell 64% in 2020 and is still 14% below the 2009-2019 average of 2,541 six years later. The OAI rate moved the</text>
<text x="24.0" y="88.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">other way: 6.7% before 2020, 10.3% after. Two readings this data cannot separate — FDA triaging scarce inspectors</text>
<text x="24.0" y="105.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">toward plants already suspected, which raises the rate by construction, or a manufacturing base that deteriorated</text>
<text x="24.0" y="122.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">during the gap.</text>
<rect x="24.0" y="140.0" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="39.0" y="149.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="">inspections a year</text>
